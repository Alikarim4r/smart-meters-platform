<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة العدادات الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#071B3A; --navy2:#0F2B52; --gold:#D6A63A; --gold2:#F8EDD4;
  --bg:#E7F1FB; --card:#FFFFFF; --line:#DCE3EE; --muted:#64748B; --text:#0B1F3A;
  --water:#2563EB; --elec:#D97706; --btu:#7C3AED; --fuel:#EA580C;
  --ok:#16A34A; --danger:#DC2626; --warn:#F59E0B;
  --shadow:0 8px 24px rgba(7,27,58,.08); --r:16px; --side:240px;
}
html[data-theme="dark"] {
  --bg:#0B1526; --card:#132338; --line:#2A3F57; --muted:#94A3B8; --text:#E8EEF8; --gold2:#3D3420;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body {
  font-family:"IBM Plex Sans Arabic", system-ui, sans-serif;
  background:var(--bg); color:var(--text); line-height:1.45;
}
button, input, select { font:inherit; }
.mono { font-family:"IBM Plex Mono", monospace; }
.hidden { display:none !important; }

/* ===== Login ===== */
#login {
  min-height:100%; display:grid; place-items:center; padding:24px;
  background:linear-gradient(145deg, var(--navy), var(--navy2));
}
.login-card {
  width:min(400px, 100%); background:#fff; color:#0B1F3A;
  border-radius:20px; padding:28px 24px; box-shadow:0 24px 60px rgba(0,0,0,.35);
}
.logo {
  width:44px; height:44px; border-radius:12px;
  background:linear-gradient(145deg, var(--gold), #b8861f);
  color:var(--navy); display:grid; place-items:center;
  font-weight:700; font-family:"IBM Plex Mono", monospace; margin-bottom:14px;
}
.login-card h1 { margin:0; font-size:1.25rem; }
.login-card .hint { margin:6px 0 18px; color:#64748B; font-size:.88rem; }
label.f { display:block; margin-bottom:12px; font-size:.8rem; color:#64748B; }
label.f input {
  display:block; width:100%; margin-top:6px; padding:12px 14px;
  border:1px solid #DCE3EE; border-radius:12px; color:#0B1F3A; background:#fff;
}
.btn {
  border:0; border-radius:12px; padding:12px 16px; font-weight:600; cursor:pointer;
  background:var(--navy); color:#fff;
}
.btn:hover { filter:brightness(1.05); }
.btn.gold { background:var(--gold); color:var(--navy); }
.btn.block { width:100%; }
.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
.btn.sm { padding:8px 12px; font-size:.82rem; border-radius:10px; }
.btn.danger { background:var(--danger); }
.err { color:var(--danger); font-size:.82rem; min-height:1.2em; margin-bottom:8px; }

/* ===== App shell: ONLY 3 grid children in flow ===== */
#app { display:none; height:100vh; }
#app.show {
  display:grid;
  /* In RTL, columns mirror: first track goes to the right — sidebar on right. */
  grid-template-columns: var(--side) 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas:
    "top top"
    "side main";
}
#topbar { grid-area:top; }
#sidebar { grid-area:side; }
#content { grid-area:main; overflow:auto; padding:16px; min-width:0; }

@media (max-width: 900px) {
  #app.show {
    grid-template-columns: 1fr;
    grid-template-rows: 56px auto 1fr;
    grid-template-areas:
      "top"
      "chips"
      "main";
  }
  #sidebar {
    position:fixed; top:56px; bottom:0; width:min(280px, 88vw); z-index:50;
    transform:translateX(110%); transition:transform .2s ease;
    box-shadow:var(--shadow);
  }
  html[dir="rtl"] #sidebar { right:0; left:auto; }
  html[dir="ltr"] #sidebar { left:0; right:auto; transform:translateX(-110%); }
  #sidebar.open { transform:translateX(0); }
  #mchips { grid-area:chips; display:flex !important; }
  #menuBtn { display:inline-flex !important; }
}

#topbar {
  display:flex; align-items:center; gap:10px; padding:0 14px;
  background:linear-gradient(90deg, var(--navy), var(--navy2)); color:#fff;
}
#topbar .titles { min-width:0; flex:1; }
#topbar .titles strong { display:block; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#topbar .titles span { display:block; font-size:.75rem; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#topbar .acts { display:flex; gap:6px; align-items:center; }
.ib {
  border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.1);
  color:#fff; border-radius:10px; padding:8px 10px; cursor:pointer; font-size:.8rem;
}
#menuBtn { display:none; }

#sidebar {
  background:var(--card); border-inline-end:1px solid var(--line);
  padding:12px; overflow:auto;
}
.brand {
  font-size:.72rem; font-weight:700; letter-spacing:.04em;
  color:var(--navy); margin:2px 8px 12px;
}
html[data-theme="dark"] .brand { color:var(--gold); }
.g { font-size:.65rem; color:var(--muted); margin:14px 8px 6px; font-weight:600; text-transform:uppercase; }
.nav {
  width:100%; text-align:start; border:0; background:transparent; color:var(--text);
  padding:10px 12px; border-radius:12px; cursor:pointer; display:flex; gap:8px; align-items:center;
}
.nav:hover { background:rgba(7,27,58,.06); }
html[data-theme="dark"] .nav:hover { background:rgba(255,255,255,.06); }
.nav.active { background:var(--navy); color:#fff; }
.nav .d { width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.35; }
.nav.active .d { background:var(--gold); opacity:1; }
.side-actions { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
.profile {
  margin-top:14px; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:.82rem;
}

#mchips {
  display:none; gap:6px; padding:8px 12px; overflow:auto;
  background:var(--card); border-bottom:1px solid var(--line);
}
.chip-nav {
  flex:none; border:1px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:999px; padding:7px 12px; font-size:.78rem; cursor:pointer;
}
.chip-nav.active { background:var(--navy); color:#fff; border-color:var(--navy); }

#backdrop {
  display:none; position:fixed; inset:56px 0 0; background:rgba(7,27,58,.4); z-index:40;
}
#backdrop.on { display:block; }

/* ===== Content ===== */
.card {
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card h2 { margin:0 0 4px; font-size:1.1rem; }
.sub { margin:0 0 12px; color:var(--muted); font-size:.86rem; }
.kpis {
  display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px;
}
@media (max-width:700px) { .kpis { grid-template-columns:1fr 1fr; } }
.kpi {
  border:1px solid var(--line); border-radius:14px; padding:14px 12px;
  background:linear-gradient(180deg, transparent, rgba(7,27,58,.02));
}
.kpi .l { font-size:.75rem; color:var(--muted); }
.kpi .v { font-size:1.5rem; font-weight:700; color:var(--navy); margin-top:4px; }
html[data-theme="dark"] .kpi .v { color:var(--gold); }
.kpi.w .v { color:var(--water); } .kpi.e .v { color:var(--elec); }
.kpi.b .v { color:var(--btu); } .kpi.f .v { color:var(--fuel); }

.banner {
  border:1px solid rgba(214,166,58,.45); background:rgba(214,166,58,.12);
  border-radius:12px; padding:10px 12px; font-size:.82rem; color:var(--muted); margin-bottom:12px;
}
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
.search {
  flex:1; min-width:180px; padding:11px 12px; border:1px solid var(--line);
  border-radius:12px; background:var(--card); color:var(--text);
}
.select {
  padding:10px 12px; border:1px solid var(--line); border-radius:12px;
  background:var(--card); color:var(--text);
}
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.chip {
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  padding:6px 12px; border-radius:999px; font-size:.78rem; cursor:pointer;
}
.chip.on { background:var(--navy); color:#fff; border-color:var(--navy); }

.site {
  border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer;
  background:linear-gradient(135deg, rgba(214,166,58,.1), transparent 50%), var(--card);
  transition: .15s;
}
.site:hover { border-color:var(--gold); transform:translateY(-1px); box-shadow:var(--shadow); }
.badge {
  display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
  font-size:.7rem; font-weight:600;
}
.badge.demo { background:var(--gold2); color:#8a6a12; }
.badge.ok { background:#dcfce7; color:#166534; }
.badge.pend { background:#ffedd5; color:#9a3412; }
.badge.al { background:#fee2e2; color:#991b1b; }
.prog { height:8px; background:rgba(7,27,58,.08); border-radius:99px; overflow:hidden; margin-top:10px; }
.prog > i { display:block; height:100%; background:linear-gradient(90deg, var(--navy), var(--gold)); }

.utilg { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
@media (max-width:800px) { .utilg { grid-template-columns:1fr 1fr; } }
.uc {
  border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; background:var(--card);
}
.uc:hover { box-shadow:var(--shadow); }
.uc .c { font-size:1.45rem; font-weight:700; margin-top:4px; }
.uc.w { border-top:3px solid var(--water); } .uc.e { border-top:3px solid var(--elec); }
.uc.b { border-top:3px solid var(--btu); } .uc.f { border-top:3px solid var(--fuel); }

.split { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
@media (max-width:800px) { .split { grid-template-columns:1fr; } }
.donut {
  width:120px; height:120px; border-radius:50%;
  display:grid; place-items:center; margin:8px 0;
}
.donut span {
  width:84px; height:84px; border-radius:50%; background:var(--card);
  display:grid; place-items:center; font-weight:700; font-size:1.35rem;
}
.line { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; align-items:start; }
.mcard {
  position:relative; overflow:hidden;
  border:1.1px solid rgba(214,166,58,.18);
  border-radius:14px; padding:10px 10px 2px 12px;
  background:linear-gradient(160deg, #ffffff 0%, #f5f9ff 48%, #eef4fb 100%);
  box-shadow:0 8px 18px rgba(30,74,122,.07);
  display:flex; flex-direction:column; gap:6px;
}
html[data-theme="dark"] .mcard {
  border-color:rgba(126,176,224,.18);
  background:linear-gradient(135deg, rgba(28,44,68,.92), rgba(19,32,51,.82) 55%, rgba(15,26,44,.88));
  box-shadow:0 14px 28px rgba(2,6,13,.45);
}
.mcard::before {
  content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 40%, transparent));
  border-radius:16px 0 0 16px;
}
html[dir="rtl"] .mcard::before { border-radius:0 16px 16px 0; }
.mcard.main { border-color:color-mix(in srgb, var(--accent) 35%, transparent); }
.mcard.main::before { width:3px; opacity:1; }
.mcard.sub::before { width:2px; opacity:.75; }
.mcard.sel { outline:1.5px solid var(--accent); outline-offset:0; }
.mcard.w { --accent:var(--water); }
.mcard.e { --accent:var(--elec); }
.mcard.b { --accent:var(--btu); }
.mcard.f { --accent:var(--fuel); }
.mcard .code { font-size:15px; font-weight:700; font-family:"IBM Plex Mono", monospace; color:var(--text); letter-spacing:.02em; }
.mcard .name { font-size:.82rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.mcard .badges { display:flex; gap:4px; flex-wrap:nowrap; overflow:auto; margin-top:6px; scrollbar-width:none; }
.mcard .badges::-webkit-scrollbar { display:none; }
.mb {
  display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px;
  font-size:.65rem; font-weight:600; white-space:nowrap;
  border:1px solid color-mix(in srgb, var(--bc, var(--muted)) 35%, transparent);
  color:var(--bc, var(--muted)); background:color-mix(in srgb, var(--bc, var(--muted)) 10%, transparent);
}
.mb.muted { opacity:.75; }
.vals { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:2px; }
.rval { text-align:start; min-width:0; }
.rval .lab { font-size:.65rem; color:var(--muted); margin-bottom:1px; letter-spacing:.02em; text-transform:uppercase; }
.rval .rv {
  display:flex; align-items:center; gap:4px; justify-content:space-between;
  font-size:1rem; font-weight:700; font-family:"IBM Plex Mono", monospace; color:var(--text);
}
.rval .rd { font-size:.62rem; color:var(--muted); margin-top:1px; }
.pbtn {
  width:22px; height:22px; border:0; border-radius:6px; background:transparent;
  color:var(--muted); cursor:pointer; padding:0; font-size:.85rem; opacity:.85;
}
.pbtn:disabled { opacity:.28; cursor:default; }
.pbtn:not(:disabled):hover { background:rgba(7,27,58,.06); }
.cons-box {
  border-radius:10px; padding:7px 10px; margin-top:2px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent) 5%, transparent));
  border:1px solid color-mix(in srgb, var(--accent) 14%, transparent);
}
.cons-box.neg { --accent:var(--danger); }
.cons-box .lab { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
.cons-box .cons {
  font-size:1.25rem; font-weight:700; color:var(--accent); margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1;
}
.cons-box .cons small { font-size:.72rem; font-weight:600; color:var(--muted); margin-inline-start:6px; }
.mfoot {
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:0;
  border-top:1px solid color-mix(in srgb, var(--line) 70%, transparent); margin-top:auto;
}
.mfoot button {
  border:0; background:transparent; color:var(--muted); cursor:pointer;
  padding:8px 4px; font-size:10px; font-weight:500; display:flex; flex-direction:column;
  align-items:center; gap:2px; border-radius:8px;
}
.mfoot button:hover { background:rgba(7,27,58,.04); color:var(--text); }
.mfoot button.on { color:var(--accent); font-weight:700; }
.mfoot .ico { font-size:14px; line-height:1; }
.lab { font-size:.7rem; color:var(--muted); }
.acts { display:flex; gap:6px; flex-wrap:wrap; }
.gh { font-size:.8rem; font-weight:700; color:var(--muted); margin:12px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--line); }
.chart {
  height:220px; border:1px solid var(--line); border-radius:12px; padding:12px 12px 8px;
  margin-top:8px; background:linear-gradient(180deg, rgba(7,27,58,.02), transparent);
  display:flex; flex-direction:column; gap:6px;
}
.chart-plot {
  flex:1; min-height:0; display:flex; align-items:flex-end; gap:3px; position:relative;
}
.chart-plot svg { width:100%; height:100%; display:block; overflow:visible; }
.chart-plot .bar {
  flex:1; min-width:2px; border-radius:5px 5px 2px 2px; position:relative;
  transition:height .25s ease;
}
.chart-plot .bar span {
  position:absolute; inset-inline-start:50%; bottom:100%; transform:translateX(-50%);
  font-size:9px; color:var(--muted); white-space:nowrap; display:none;
}
.chart-plot .bar:hover span { display:block; }
.chart-labels {
  display:flex; justify-content:space-between; gap:2px; font-size:9px; color:var(--muted);
}
.chart-labels span { flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chart-legend { display:flex; flex-wrap:wrap; gap:8px; font-size:.75rem; color:var(--muted); }
.chart-legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:4px; vertical-align:middle; }
.chart-empty { flex:1; display:grid; place-items:center; color:var(--muted); font-size:.86rem; }
.chart-meta { font-size:.78rem; color:var(--muted); margin:0; }
.pie-wrap { display:flex; align-items:center; gap:16px; height:100%; }
.pie-wrap svg { width:140px; height:140px; flex:none; }
.rank-list { width:100%; overflow:auto; }
.rank-row { display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:.82rem; }
.rank-bar { height:6px; border-radius:99px; background:rgba(7,27,58,.08); overflow:hidden; margin-top:4px; }
.rank-bar > i { display:block; height:100%; border-radius:99px; }
.tree .n { padding:9px 11px; border:1px solid var(--line); border-radius:10px; margin:4px 0; }
.tree .c { margin-inline-start:18px; border-style:dashed; font-size:.88rem; }
.empty { text-align:center; padding:28px; color:var(--muted); border:1px dashed var(--line); border-radius:12px; }
.alert {
  display:flex; gap:10px; padding:11px; border:1px solid var(--line); border-radius:12px;
  margin-bottom:8px; cursor:pointer; background:var(--card);
}
.sev { width:9px; height:9px; border-radius:50%; margin-top:6px; flex:none; }
.sev.crit { background:var(--danger); } .sev.warn { background:var(--warn); } .sev.info { background:var(--water); }
.rgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:10px; }
.rc { border:1px solid var(--line); border-radius:12px; padding:14px; }
.rc h3 { margin:0 0 6px; font-size:.95rem; } .rc p { margin:0 0 10px; color:var(--muted); font-size:.8rem; }

.overlay {
  position:fixed; inset:0; background:rgba(7,27,58,.45); display:none;
  align-items:center; justify-content:center; padding:16px; z-index:80;
}
.overlay.on { display:flex; }
.modal {
  width:min(520px,100%); max-height:90vh; overflow:auto; background:var(--card);
  border-radius:18px; padding:18px; border:1px solid var(--line); box-shadow:var(--shadow);
}
.modal.wide { width:min(820px,100%); }
.modal h3 { margin:0 0 12px; }
.modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
.drawer {
  position:fixed; top:0; bottom:0; width:min(360px,92vw); background:var(--card);
  border:1px solid var(--line); padding:16px; z-index:90; display:none; overflow:auto; box-shadow:var(--shadow);
}
html[dir="rtl"] .drawer { left:0; } html[dir="ltr"] .drawer { right:0; }
.drawer.on { display:block; }
.toast {
  position:fixed; bottom:18px; inset-inline-end:18px; background:var(--navy); color:#fff;
  padding:11px 14px; border-radius:12px; z-index:100; display:none; font-size:.86rem;
}
.toast.on { display:block; }
.tbl { width:100%; border-collapse:collapse; font-size:.82rem; }
.tbl th, .tbl td { border-bottom:1px solid var(--line); padding:8px 6px; text-align:start; }
.photo {
  aspect-ratio:4/3; border-radius:12px; background:linear-gradient(135deg,#cbd5e1,#94a3b8);
  display:grid; place-items:center; color:#334155;
}
details.z { margin:8px 0; }
details.z summary { cursor:pointer; font-weight:600; padding:8px 0; }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="logo">SM</div>
    <h1 id="lgTitle">لوحة العدادات الذكية</h1>
    <p class="hint" id="lgHint">تسجيل الدخول إلى لوحة العرض</p>
    <label class="f" id="lgEmailLbl">البريد الإلكتروني
      <input id="email" value="test-super-admin@validation.local" autocomplete="username">
    </label>
    <label class="f" id="lgPassLbl">كلمة المرور
      <input id="password" type="password" value="ValidationTest1!" autocomplete="current-password">
    </label>
    <div class="err" id="lgErr"></div>
    <button class="btn gold block" id="btnLogin" type="button">دخول</button>
    <p class="hint" style="margin:14px 0 0;font-size:.75rem;text-align:center">Staging · بيانات حقيقية · 49 عداد</p>
  </div>
</div>

<div id="app">
  <header id="topbar">
    <button class="ib" id="menuBtn" type="button" aria-label="menu">☰</button>
    <div class="logo" style="width:34px;height:34px;margin:0;font-size:.8rem;border-radius:10px">SM</div>
    <div class="titles">
      <strong id="topTitle">لوحة العدادات الذكية</strong>
      <span id="topCrumb">المواقع</span>
    </div>
    <div class="acts">
      <button class="ib" id="btnDate" type="button" title="date">📅</button>
      <button class="ib" id="btnBell" type="button" title="alerts">🔔</button>
      <button class="ib" id="btnExport" type="button" title="export">⬇</button>
      <button class="ib" id="btnRefresh" type="button" title="refresh">↻</button>
      <button class="ib hidden" id="btnBack" type="button" title="back">←</button>
    </div>
  </header>

function accent(cat) {
  return ({ water:'var(--water)', electricity:'var(--elec)', btu:'var(--btu)', fuel:'var(--fuel)' })[cat] || 'var(--navy)';
}
function accentHex(cat) {
  return ({ water:'#2563EB', electricity:'#D97706', btu:'#7C3AED', fuel:'#EA580C' })[cat] || '#071B3A';
}

function parseDay(s) {
  const [y,m,d] = String(s).slice(0,10).split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtDay(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(d, n) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth()+1, 0); }

function periodBounds(period, daily) {
  const dates = (daily || []).map(p => p.date).sort();
  if (!dates.length) return null;
  const max = parseDay(dates[dates.length - 1]);
  const minAll = parseDay(dates[0]);
  if (period === 'last31') return { from: addDays(max, -30), to: max, grain: 'day' };
  if (period === 'm12') {
    const from = new Date(max.getFullYear(), max.getMonth() - 11, 1);
    return { from: from < minAll ? minAll : from, to: endOfMonth(max), grain: 'month' };
  }
  if (period === 'y5') {
    return { from: new Date(max.getFullYear() - 4, 0, 1), to: max, grain: 'year' };
  }
  const monthMap = { jan:'2026-01', feb:'2026-02', mar:'2026-03', apr:'2026-04', may:'2026-05', jun:'2026-06', jul:'2026-07' };
  if (monthMap[period]) {
    const [y,m] = monthMap[period].split('-').map(Number);
    return { from: new Date(y, m-1, 1), to: new Date(y, m, 0), grain: 'day' };
  }
  return { from: minAll, to: max, grain: 'day' };
}

function filterDaily(daily, period) {
  const b = periodBounds(period, daily);
  if (!b) return [];
  return (daily || []).filter(p => {
    const d = parseDay(p.date);
    return d >= b.from && d <= b.to;
  });
}

function bucketSeries(points, grain) {
  if (grain === 'day') return points.map(p => ({ label: p.date.slice(5), full: p.date, value: p.value }));
  const map = {};
  for (const p of points) {
    const key = grain === 'year' ? p.date.slice(0,4) : p.date.slice(0,7);
    map[key] = (map[key] || 0) + p.value;
  }
  return Object.keys(map).sort().map(k => ({
    label: grain === 'year' ? k : k.slice(5),
    full: k,
    value: Math.round(map[k] * 100) / 100
  }));
}

function weekdaySeries(points) {
  const names = state.lang === 'ar'
    ? ['أحد','إثن','ثلا','أرب','خمي','جمع','سبت']
    : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const sums = Array(7).fill(0);
  for (const p of points) sums[parseDay(p.date).getDay()] += p.value;
  return names.map((label, i) => ({ label, full: label, value: Math.round(sums[i] * 100) / 100 }));
}

function cumulativeSeries(series) {
  let run = 0;
  return series.map(p => {
    run += p.value;
    return { ...p, value: Math.round(run * 100) / 100 };
  });
}

function chartPoints(cat, type, period) {
  const data = chartDataOf();
  if (!data || !data[cat]) return { series: [], meta: 'no-data' };
  const daily = data[cat].daily || [];
  const filtered = filterDaily(daily, period);
  const b = periodBounds(period, daily);
  const grain = b ? b.grain : 'day';

  if (type === 'weekday') return { series: weekdaySeries(filtered), meta: 'weekday', unitHint: 'day' };
  if (type === 'ranking') {
    const ranks = (data[cat].ranking || []).map(r => {
      // recompute ranking in period from meterDaily if available
      return r;
    });
    const meterDaily = data[cat].meterDaily || {};
    const totals = {};
    for (const [code, pts] of Object.entries(meterDaily)) {
      const sum = filterDaily(pts, period).reduce((a,p)=>a+p.value, 0);
      if (sum > 0) totals[code] = sum;
    }
    const ranked = Object.entries(totals)
      .map(([code, value]) => ({ code, value: Math.round(value*100)/100, name: (data[cat].meterNames||{})[code] || code }))
      .sort((a,b)=>b.value-a.value)
      .slice(0, 8);
    return { series: ranked, meta: 'ranking' };
  }
  if (type === 'pie' || type === 'split') {
    const bySource = data[cat].sourceDaily || {};
    const out = [];
    for (const [src, pts] of Object.entries(bySource)) {
      const value = filterDaily(pts, period).reduce((a,p)=>a+p.value, 0);
      if (value > 0) out.push({ label: srcLabel(src), full: src, value: Math.round(value*100)/100 });
    }
    out.sort((a,b)=>b.value-a.value);
    return { series: out, meta: type };
  }
  if (type === 'stacked' && state.compare.length) {
    const meterDaily = data[cat].meterDaily || {};
    const series = state.compare.map(code => {
      const pts = filterDaily(meterDaily[code] || [], period);
      const buck = bucketSeries(pts, grain === 'day' && pts.length > 45 ? 'month' : grain);
      return { code, points: buck };
    });
    return { series, meta: 'stacked' };
  }
  if (type === 'cop' && cat === 'btu') {
    const plant = filterDaily((data.copPlant||{}).daily || [], period);
    if (plant.length) {
      return { series: plant.map(p => ({
        label: p.date.slice(5), full: p.date,
        value: Math.round(p.value*1000)/1000, raw: p.value
      })), meta: 'cop' };
    }
    // Fallback (legacy showcase): all BTU / all electricity — prefer wired COP group.
    const btu = filterDaily((data.btu||{}).daily || [], period);
    const elec = filterDaily((data.electricity||{}).daily || [], period);
    const emap = Object.fromEntries(elec.map(p => [p.date, p.value]));
    const series = btu.map(p => {
      const e = emap[p.date];
      const v = e && e > 0 ? p.value / e : null;
      return { label: p.date.slice(5), full: p.date, value: v == null ? 0 : Math.round(v*1000)/1000, raw: v };
    }).filter(p => p.raw != null);
    return { series, meta: 'cop' };
  }

  let series = bucketSeries(filtered, (grain === 'day' && filtered.length > 45) ? 'month' : grain);
  if (type === 'cumulative') series = cumulativeSeries(series);
  return { series, meta: type || 'line' };
}

function svgLine(series, cat, { area=false, step=false } = {}) {
  const w = 600, h = 160, pad = 12;
  if (!series.length) return '';
  const vals = series.map(p => p.value);
  const max = Math.max(...vals, 1e-6);
  const min = Math.min(0, ...vals);
  const span = Math.max(max - min, 1e-6);
  const n = series.length;
  const xAt = (i) => pad + (n === 1 ? (w-2*pad)/2 : i * (w - 2*pad) / (n - 1));
  const yAt = (v) => pad + (1 - (v - min) / span) * (h - 2*pad);
  let d = '';
  series.forEach((p, i) => {
    const x = xAt(i), y = yAt(p.value);
    if (i === 0) d += `M ${x} ${y}`;
    else if (step) {
      const px = xAt(i-1);
      d += ` H ${x} V ${y}`;
      void px;
    } else d += ` L ${x} ${y}`;
  });
  const color = accentHex(cat);
  let extra = '';
  if (area) {
    const lastX = xAt(n-1), firstX = xAt(0), base = yAt(0);
    extra = `<path d="${d} L ${lastX} ${base} L ${firstX} ${base} Z" fill="${color}" opacity=".18"></path>`;
  }
  const dots = series.map((p,i) => `<circle cx="${xAt(i)}" cy="${yAt(p.value)}" r="2.5" fill="${color}"><title>${p.full}: ${fmtVal(p.value)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${extra}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>${dots}</svg>`;
}

function barsHtml(series, cat) {
  const max = Math.max(...series.map(p => p.value), 1e-6);
  const color = ({
    water:'linear-gradient(180deg,#60a5fa,var(--water))',
    electricity:'linear-gradient(180deg,#fbbf24,var(--elec))',
    btu:'linear-gradient(180deg,#c4b5fd,var(--btu))',
    fuel:'linear-gradient(180deg,#fdba74,var(--fuel))'
  })[cat];
  return series.map(p => {
    const h = Math.max(4, Math.round(100 * p.value / max));
    return `<div class="bar" style="height:${h}%;background:${color}" title="${p.full}: ${fmtVal(p.value)}"><span>${fmtVal(p.value, true)}</span></div>`;
  }).join('');
}

function pieHtml(series, cat) {
  const total = series.reduce((a,p)=>a+p.value, 0) || 1;
  const colors = ['#2563EB','#D97706','#7C3AED','#EA580C','#16A34A','#0891B2','#DB2777','#64748B'];
  let ang = -90;
  const r = 60, cx = 70, cy = 70;
  const slices = series.map((p, i) => {
    const sweep = (p.value / total) * 360;
    const a1 = ang * Math.PI / 180;
    ang += sweep;
    const a2 = ang * Math.PI / 180;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const large = sweep > 180 ? 1 : 0;
    const color = colors[i % colors.length];
    return `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${color}"><title>${p.label}: ${fmtVal(p.value)}</title></path>`;
  }).join('');
  const legend = series.map((p,i) => `<span><i style="background:${colors[i%colors.length]}"></i>${p.label} · ${fmtVal(p.value, true)}</span>`).join('');
  return `<div class="pie-wrap"><svg viewBox="0 0 140 140">${slices}</svg><div class="chart-legend">${legend}</div></div>`;
}

function rankingHtml(series, cat) {
  const max = Math.max(...series.map(p => p.value), 1e-6);
  const color = accentHex(cat);
  if (!series.length) return `<div class="chart-empty">${t('noMatch')}</div>`;
  return `<div class="rank-list">${series.map((p,i) => `
    <div class="rank-row">
      <strong>${i+1}</strong>
      <div>
        <div class="mono">${p.code}</div>
        <div class="sub" style="margin:0">${p.name || ''}</div>
        <div class="rank-bar"><i style="width:${Math.round(100*p.value/max)}%;background:${color}"></i></div>
      </div>
      <strong>${fmtVal(p.value, true)}</strong>
    </div>`).join('')}</div>`;
}

function stackedHtml(payload, cat) {
  const colors = ['#2563EB','#D97706','#7C3AED','#EA580C','#16A34A'];
  const keys = payload.series.map(s => s.code);
  const labelSet = [];
  const seen = new Set();
  for (const s of payload.series) for (const p of s.points) {
    if (!seen.has(p.full)) { seen.add(p.full); labelSet.push(p.full); }
  }
  const rows = labelSet.map(full => {
    const vals = payload.series.map(s => (s.points.find(p => p.full === full) || { value:0 }).value);
    return { label: full.length > 7 ? full.slice(5) : full, full, vals };
  });
  const max = Math.max(...rows.flatMap(r => r.vals), 1e-6);
  const bars = rows.map(r => {
    const segs = r.vals.map((v,i) => {
      const h = Math.max(0, Math.round(100 * v / max));
      return `<div style="height:${h}%;width:100%;background:${colors[i%colors.length]};border-radius:2px" title="${keys[i]}: ${fmtVal(v)}"></div>`;
    }).join('');
    return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;height:100%">${segs}</div>`;
  }).join('');
  const legend = keys.map((k,i) => `<span><i style="background:${colors[i%colors.length]}"></i>${k}</span>`).join('');
  const labels = rows.map(r => `<span title="${r.full}">${r.label}</span>`).join('');
  return `<div class="chart-plot" style="gap:4px">${bars}</div><div class="chart-labels">${labels}</div><div class="chart-legend">${legend}</div>`;
}

function renderChart(cat) {
  const type = state.chart[cat] || CHARTS[cat][0];
  const period = state.period;
  if (!chartDataOf()) {
    // fallback to old monthly heights
    const series = chartsOf()[cat] || { heights:[], months:[], values:[] };
    const hs = series.heights.length ? series.heights : [];
    if (!hs.length) return `<div class="chart"><div class="chart-empty">${t('noMatch')}</div></div>`;
    const fake = hs.map((h,i) => ({ label:(series.months[i]||'').slice(5), full:series.months[i]||'', value:series.values[i]||0 }));
    return `<div class="chart"><div class="chart-plot">${barsHtml(fake, cat)}</div><div class="chart-labels">${fake.map(p=>`<span>${p.label}</span>`).join('')}</div></div>`;
  }

  const payload = chartPoints(cat, type, period);
  if (payload.meta === 'ranking') {
    return `<div class="chart" style="height:auto;min-height:220px">${rankingHtml(payload.series, cat)}</div>`;
  }
  if (payload.meta === 'pie') {
    return `<div class="chart">${payload.series.length ? pieHtml(payload.series, cat) : `<div class="chart-empty">${t('noMatch')}</div>`}</div>`;
  }
  if (payload.meta === 'split') {
    if (!payload.series.length) return `<div class="chart"><div class="chart-empty">${t('noMatch')}</div></div>`;
    return `<div class="chart"><div class="chart-plot">${barsHtml(payload.series, cat)}</div><div class="chart-labels">${payload.series.map(p=>`<span>${p.label}</span>`).join('')}</div></div>`;
  }
  if (payload.meta === 'stacked') {
    if (!state.compare.length) return `<div class="chart"><div class="chart-empty">${state.lang==='ar'?'اختر عدادات للمقارنة':'Select meters to compare'}</div></div>`;
    return `<div class="chart" style="height:260px">${stackedHtml(payload, cat)}</div>`;
  }

  const series = payload.series || [];
  if (!series.length) {
    return `<div class="chart"><div class="chart-empty">${t('noMatch')}</div></div>`;
  }

  let plot = '';
  if (type === 'bar' || type === 'weekday') {
    plot = `<div class="chart-plot">${barsHtml(series, cat)}</div><div class="chart-labels">${series.map(p=>`<span title="${p.full}">${p.label}</span>`).join('')}</div>`;
  } else if (type === 'area') {
    plot = `<div class="chart-plot">${svgLine(series, cat, { area:true })}</div><div class="chart-labels">${series.map(p=>`<span>${p.label}</span>`).join('')}</div>`;
  } else if (type === 'step') {
    plot = `<div class="chart-plot">${svgLine(series, cat, { step:true })}</div><div class="chart-labels">${series.map(p=>`<span>${p.label}</span>`).join('')}</div>`;
  } else {
    // line / cumulative / cop
    plot = `<div class="chart-plot">${svgLine(series, cat)}</div><div class="chart-labels">${series.map(p=>`<span>${p.label}</span>`).join('')}</div>`;
  }
  const sum = series.reduce((a,p)=>a+(p.value||0),0);
  return `<div class="chart">${plot}</div>`;
}


function periodLabel(period) {
  const map = {
    last31: t('last31'), m12: t('m12'), y5: t('y5'),
    jan:'Jan 2026', feb:'Feb 2026', mar:'Mar 2026', apr:'Apr 2026', may:'May 2026', jun:'Jun 2026', jul:'Jul 2026'
  };
  return map[period] || period;
}
function chartSummary(cat) {
  const type = state.chart[cat] || CHARTS[cat][0];
  const payload = chartDataOf() ? chartPoints(cat, type === 'stacked' ? 'line' : (type === 'ranking' || type === 'pie' || type === 'split' ? type : type), state.period) : null;
  if (!payload) return '';
  if (payload.meta === 'ranking') return `${payload.series.length} meters`;
  if (Array.isArray(payload.series) && payload.series[0] && payload.series[0].points) return `${state.compare.length} series`;
  const series = payload.series || [];
  const sum = series.reduce((a,p)=>a+(Number(p.value)||0),0);
  return `${series.length} pts · Σ ${fmtVal(sum, true)}`;
}

function bars(cat) { return renderChart(cat); }

function fmtVal(v, compact=false) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  if (compact) {
    if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (Math.abs(n) >= 100000) return (n/1000).toFixed(1) + 'k';
  }
  if (Math.abs(n - Math.round(n)) < 1e-9) return Math.round(n).toLocaleString('en-US');
  return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
}
function fmtDate(d) {
  if (!d) return '';
  return String(d).slice(0,10);
}

function shortName(m) {
  const full = state.lang==='ar' && m.name_ar ? m.name_ar : (m.name_en || m.meter_code);
  const cut = full.split('|')[0].trim();
  return cut.length > 42 ? cut.slice(0,40) + '…' : cut;
}

function srcLabel(s) {
  const map = {kahramaa:'Kahramaa', chilled_water:'Chilled', tse:'TSE', ro:'RO', other:'Other'};
  return map[s] || s || '—';
}

function filterMeters(cat) {
  let list = byCat(cat);
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter(m =>
    m.meter_code.toLowerCase().includes(q) ||
    (m.name_en||'').toLowerCase().includes(q) ||
    (m.name_ar||'').includes(q)
  );
  if (state.status === 'submitted') list = list.filter(m => m.status === 'submitted');
  if (state.status === 'pending') list = list.filter(m => m.status === 'pending');
  if (state.status === 'hasAlert') list = list.filter(m => m.has_alert);
  if (state.status === 'hasPhoto') list = list.filter(m => m.has_photo);
  if (state.status === 'missingPhoto') list = list.filter(m => !m.has_photo);
  if (state.source !== 'all') list = list.filter(m => (m.source||'') === state.source);
  const dir = state.asc ? 1 : -1;
  list = [...list].sort((a,b) => {
    if (state.sort === 'pending') return ((a.status==='pending'?0:1) - (b.status==='pending'?0:1)) || ((a.sort_order||0)-(b.sort_order||0));
    if (state.sort === 'order') return ((a.sort_order||0) - (b.sort_order||0)) * dir || String(a.meter_code).localeCompare(String(b.meter_code));
    const av = state.sort==='name' ? (a.name_en||'') : state.sort==='cons' ? (a.cons||0) : a.meter_code;
    const bv = state.sort==='name' ? (b.name_en||'') : state.sort==='cons' ? (b.cons||0) : b.meter_code;
    return av > bv ? dir : av < bv ? -dir : 0;
  });
  return list;
}

async function sb(path, { method='GET', body=null, token=null } = {}) {
  const headers = { apikey: CFG.anonKey, 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(CFG.supabaseUrl + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const msg = await res.text().catch(()=>'');
    throw new Error(res.status + ' ' + msg.slice(0,120));
  }
  if (res.status === 204) return null;
  return res.json();
}

function numOrNull(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function roundNice(v) {
  if (v === null) return null;
  if (Math.abs(v - Math.round(v)) < 1e-9) return Math.round(v);
  return Math.round(v * 100) / 100;
}


function buildFromApi(meters, readings, copIds) {
  const by = {};
  for (const r of readings) (by[r.meter_id] ||= []).push(r);
  // ensure each meter readings sorted desc by date
  for (const mid of Object.keys(by)) {
    by[mid].sort((a,b) => String(b.reading_date).localeCompare(String(a.reading_date)));
  }

  const out = [];
  const history = {};
  const photos = {};
  const chartData = {
    water: { daily:{}, meterDaily:{}, sourceDaily:{}, meterNames:{} },
    electricity: { daily:{}, meterDaily:{}, sourceDaily:{}, meterNames:{} },
    btu: { daily:{}, meterDaily:{}, sourceDaily:{}, meterNames:{} },
    fuel: { daily:{}, meterDaily:{}, sourceDaily:{}, meterNames:{} },
    copPlant: { daily:{}, btuDaily:{}, elecDaily:{} }
  };
  const copBtu = new Set((copIds && copIds.btu) || []);
  const copElec = new Set((copIds && copIds.elec) || []);

  function addPoint(bucket, date, value) {
    if (!date || value == null || value < 0) return;
    bucket[date] = (bucket[date] || 0) + value;
  }

  for (const m of meters) {
    const rs = by[m.id] || [];
    const curr = rs[0] || null;
    const prev = rs[1] || null;
    const cv = numOrNull(curr && (curr.normalized_value ?? curr.raw_value));
    const pv = numOrNull(prev && (prev.normalized_value ?? prev.raw_value));
    const cons = (cv !== null && pv !== null) ? roundNice(cv - pv) : null;
    const currPhoto = !!(curr && curr.image_url);
    const prevPhoto = !!(prev && prev.image_url);
    const status = curr ? 'submitted' : 'pending';
    const item = {
      id: m.id,
      meter_code: m.meter_code,
      name_en: m.name_en || m.meter_code,
      name_ar: m.name_ar || m.name_en || m.meter_code,
      level: m.level || 'main',
      parent_meter_id: m.parent_meter_id,
      is_active: !!m.is_active,
      category: m.category,
      source: m.source || 'other',
      sort_order: m.sort_order || 0,
      unit: m.unit || '',
      status,
      curr: roundNice(cv),
      prev: roundNice(pv),
      cons,
      curr_date: curr ? curr.reading_date : null,
      prev_date: prev ? prev.reading_date : null,
      has_photo: currPhoto || prevPhoto,
      curr_photo: currPhoto,
      prev_photo: prevPhoto,
      has_alert: status === 'pending',
      negative: cons !== null && cons < 0,
      reading_count: rs.length
    };
    out.push(item);

    history[m.meter_code] = rs.slice(0, 24).map((r, i) => {
      const v = numOrNull(r.normalized_value ?? r.raw_value);
      const p = rs[i+1] ? numOrNull(rs[i+1].normalized_value ?? rs[i+1].raw_value) : null;
      const c = (v !== null && p !== null) ? roundNice(v - p) : null;
      return { date: r.reading_date, value: roundNice(v), cons: c, photo: !!r.image_url, image_url: r.image_url || null, note: r.note || '' };
    });
    if (currPhoto) photos[m.meter_code + ':curr'] = curr.image_url;
    if (prevPhoto) photos[m.meter_code + ':prev'] = prev.image_url;

    const cat = chartData[m.category];
    if (!cat) continue;
    // Keep validation/inactive meters on cards, but exclude from analytics charts.
    const skipChart = !m.is_active || String(m.meter_code || '').startsWith('VAL-');
    cat.meterNames[m.meter_code] = (m.name_en || m.meter_code).split('|')[0].trim();
    cat.meterDaily[m.meter_code] = cat.meterDaily[m.meter_code] || {};
    cat.sourceDaily[m.source || 'other'] = cat.sourceDaily[m.source || 'other'] || {};

    // rs is desc; walk consecutive pairs (newer vs older)
    for (let i = 0; i < rs.length - 1; i++) {
      const newer = rs[i];
      const older = rs[i+1];
      const nv = numOrNull(newer.normalized_value ?? newer.raw_value);
      const ov = numOrNull(older.normalized_value ?? older.raw_value);
      if (nv === null || ov === null) continue;
      let delta = nv - ov;
      // Skip resets/negatives. Cap loose for kWh_th (GJ×277.78); tighter elsewhere.
      const maxDelta = m.category === 'btu' ? 5e7 : 500000;
      if (delta < 0 || delta > maxDelta) continue;
      if (skipChart) continue;
      // Live client bridge: CHW still tagged water/m3 → treat energy as GJ→kWh_th for charts.
      if (m._chw_gj_bridge) delta = delta * 277.777778;
      const date = String(newer.reading_date || '').slice(0,10);
      addPoint(cat.daily, date, delta);
      addPoint(cat.meterDaily[m.meter_code], date, delta);
      addPoint(cat.sourceDaily[m.source || 'other'], date, delta);
      if (copBtu.has(m.id)) addPoint(chartData.copPlant.btuDaily, date, delta);
      if (copElec.has(m.id)) addPoint(chartData.copPlant.elecDaily, date, delta);
    }
  }

  // Plant COP = Σ CHW loops (kWh_th) / Σ LVP-4+5 (kWh) for shared days
  {
    const btuD = chartData.copPlant.btuDaily;
    const elD = chartData.copPlant.elecDaily;
    const days = Object.keys(btuD).filter(d => elD[d] > 0 && btuD[d] > 0).sort();
    chartData.copPlant.daily = days.map(date => ({
      date,
      value: Math.round((btuD[date] / elD[date]) * 1000) / 1000
    }));
    delete chartData.copPlant.btuDaily;
    delete chartData.copPlant.elecDaily;
  }

  function toArr(mapObj) {
    return Object.keys(mapObj).sort().map(date => ({ date, value: Math.round(mapObj[date] * 100) / 100 }));
  }
  for (const cat of Object.keys(chartData)) {
    const c = chartData[cat];
    if (cat === 'copPlant') continue;
    c.daily = toArr(c.daily);
    const md = {};
    for (const [code, mapObj] of Object.entries(c.meterDaily)) md[code] = toArr(mapObj);
    c.meterDaily = md;
    const sd = {};
    for (const [src, mapObj] of Object.entries(c.sourceDaily)) sd[src] = toArr(mapObj);
    c.sourceDaily = sd;
    c.ranking = Object.entries(md).map(([code, pts]) => ({
      code, name: c.meterNames[code], value: Math.round(pts.reduce((a,p)=>a+p.value,0)*100)/100
    })).sort((a,b)=>b.value-a.value).slice(0, 8);
  }

  // legacy monthly heights for fallback
  const chart = {};
  for (const cat of ['water','electricity','btu','fuel']) {
    const months = {};
    for (const p of chartData[cat].daily) {
      const mo = p.date.slice(0,7);
      months[mo] = (months[mo] || 0) + p.value;
    }
    const keys = Object.keys(months).sort().slice(-12);
    const values = keys.map(k => Math.round(months[k]*100)/100);
    const mx = Math.max(...values, 1);
    chart[cat] = { months: keys, values, heights: values.map(v => Math.max(8, Math.round(100*v/mx))) };
  }

  const alerts = [];
  for (const m of out) {
    if (m.status === 'pending') alerts.push({ sev:'crit', ar:'قراءة مفقودة', en:'Missing reading', meter:m.meter_code, cat:m.category });
    else if (m.negative) alerts.push({ sev:'warn', ar:'استهلاك سالب', en:'Negative consumption', meter:m.meter_code, cat:m.category });
  }
  let n = 0;
  for (const m of out) {
    if (m.status === 'submitted' && !m.has_photo && n < 4) {
      alerts.push({ sev:'info', ar:'صورة مفقودة', en:'Missing photo', meter:m.meter_code, cat:m.category });
      n++;
    }
  }
  return { meters: out, history, photos, chart, chartData, alerts };
}

async function fetchAllReadings(token, site) {
  const pageSize = 1000;
  let offset = 0;
  const all = [];
  // Prefer 2026+ real operational data for charts + cards
  while (true) {
    const chunk = await sb(
      `/rest/v1/meter_readings?site_id=eq.${site}&reading_date=gte.2026-01-01&select=meter_id,reading_date,normalized_value,raw_value,note,image_url&order=reading_date.desc&limit=${pageSize}&offset=${offset}`,
      { token }
    );
    if (!chunk || !chunk.length) break;
    all.push(...chunk);
    offset += chunk.length;
    if (chunk.length < pageSize) break;
  }
  return all;
}

function normalizeLiveMeter(m) {
  const code = String(m.meter_code || '').toUpperCase();
  if (!code.startsWith('CHW-LOOP')) return m;
  // Prefer DB category after migration 016; bridge while still mis-tagged as water/m3.
  if (m.category === 'btu' && String(m.unit || '').toLowerCase() === 'gj') return m;
  return {
    ...m,
    category: 'btu',
    source: m.source && m.source !== 'kahramaa' ? m.source : 'chilled_water',
    unit: 'gj',
    _chw_gj_bridge: true
  };
}

async function loadLiveData(token) {
  const site = CFG.siteId;
  const copId = '44444444-4444-4444-8444-444444444444';
  const metersRaw = await sb(`/rest/v1/meters?site_id=eq.${site}&is_active=eq.true&include_in_dashboard=eq.true&select=id,meter_code,name_en,name_ar,level,parent_meter_id,is_active,include_in_dashboard,category,source,sort_order,unit&order=sort_order&limit=200`, { token });
  const meters = (metersRaw || []).map(normalizeLiveMeter).filter(isRealMeter);
  const [readings, copBtuRows, copElRows] = await Promise.all([
    fetchAllReadings(token, site),
    sb(`/rest/v1/cop_group_btu_meters?cop_group_id=eq.${copId}&select=meter_id`, { token }).catch(() => []),
    sb(`/rest/v1/cop_group_electricity_meters?cop_group_id=eq.${copId}&select=meter_id`, { token }).catch(() => [])
  ]);
  let copIds = {
    btu: (copBtuRows || []).map(r => r.meter_id),
    elec: (copElRows || []).map(r => r.meter_id)
  };
  // Fallback wiring if group empty: CHW loops + LVP-4/5
  if (!copIds.btu.length || !copIds.elec.length) {
    const byCode = Object.fromEntries(meters.map(m => [m.meter_code, m.id]));
    copIds = {
      btu: ['CHW-LOOP-1','CHW-LOOP-2','CHW-LOOP-3'].map(c => byCode[c]).filter(Boolean),
      elec: ['1256361','1256362'].map(c => byCode[c]).filter(Boolean)
    };
  }
  const allowed = new Set(meters.map(m => m.id));
  // Keep LVP COP members even if somehow filtered
  for (const id of [...copIds.btu, ...copIds.elec]) allowed.add(id);
  const readingsScoped = (readings || []).filter(r => allowed.has(r.meter_id));
  const built = buildFromApi(meters, readingsScoped, copIds);
  METERS_LIVE = built.meters;
  HISTORY_LIVE = built.history;
  PHOTO_URLS_LIVE = built.photos;
  CHART_SERIES_LIVE = built.chart;
  CHART_DATA_LIVE = built.chartData;
  ALERTS_LIVE = built.alerts;
  state.dataMeta = {
    readings: readings.length,
    from: readings.length ? readings[readings.length-1].reading_date : null,
    to: readings.length ? readings[0].reading_date : null
  };
  return built;
}

async function loginAndLoad() {
  const email = $('email').value.trim();
  const pass = $('password').value;
  if (!email || pass.length < 6) {
    $('lgErr').textContent = t('badLogin');
    return;
  }
  $('lgErr').textContent = state.lang==='ar' ? 'جاري تحميل البيانات من Staging…' : 'Loading Staging data…';
  $('btnLogin').disabled = true;
  try {
    const auth = await sb('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: { email, password: pass }
    });
    state.token = auth.access_token;
    state.user = (auth.user && (auth.user.email || email)) || email;
    await loadLiveData(state.token);
    $('lgErr').textContent = '';
    $('login').style.display = 'none';
    $('login').setAttribute('hidden', '');
    $('app').classList.add('show');
    $('app').removeAttribute('hidden');
    state.view = 'home';
    state.site = false;
    toast(state.lang==='ar' ? 'تم تحميل بيانات Staging' : 'Staging data loaded');
    render();
  } catch (e) {
    console.error(e);
    $('lgErr').textContent = t('badLogin');
  } finally {
    $('btnLogin').disabled = false;
  }
}

$('btnLogin').onclick = () => { loginAndLoad(); };


$('menuBtn').onclick = () => {
  $('sidebar').classList.toggle('open');
  $('backdrop').classList.toggle('on');
};
$('backdrop').onclick = () => {
  $('sidebar').classList.remove('open');
  $('backdrop').classList.remove('on');
};
$('btnBell').onclick = showBell;
$('btnExport').onclick = () => showExport(state.view === 'home' ? 'allSites' : 'siteOverview');
$('btnRefresh').onclick = async () => {
  if (!state.token) { toast(t('refreshed')); return; }
  try {
    await loadLiveData(state.token);
    render();
    toast(t('refreshed'));
  } catch (e) {
    toast(state.lang==='ar'?'فشل التحديث':'Refresh failed');
  }
};
$('btnDate').onclick = showDate;
$('btnBack').onclick = () => go('home');
$('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeAll(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAll();
  if (e.key === '/' && $('app').classList.contains('show')) {
    e.preventDefault();
    const s = $('q') || $('homeQ');
    if (s) s.focus();
  }
});

applyChrome();
</script>
</body>
</html>
