version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.9.1
  app_links: ^7.2.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
