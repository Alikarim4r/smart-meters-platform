name: Deploy Web Apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_ENV: production
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Custom domain: served from the origin root, so no repo-name prefix.
          WEB_BASE_HREF: ""
          GITHUB_PAGES_BASE: https://meters.alielhassan.com
          PAGES_CNAME: meters.alielhassan.com
        run: |
          chmod +x scripts/build_web_apps.sh scripts/generate_app_icons.sh
          ./scripts/generate_app_icons.sh
          ./scripts/build_web_apps.sh

      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          publish_branch: gh-pages
          # This action force-pushes publish_dir, so without cname the CNAME
          # file GitHub writes from the repository settings is deleted on the
          # next deploy and the custom domain drops.
          cname: meters.alielhassan.com
